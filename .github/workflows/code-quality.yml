name: Code Quality and Security Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly security check on Mondays at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CACHE_SUFFIX: v1

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci --prefer-offline --no-audit
        else
          npm install --prefer-offline --no-audit
        fi
        
    - name: Check code formatting
      run: |
        echo "## Code Formatting Check" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for common formatting issues
        FORMATTING_ISSUES=0
        
        # Check for trailing whitespace
        if grep -r " $" src/ --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" > /dev/null 2>&1; then
          echo "- WARNING: Trailing whitespace found in source files" >> $GITHUB_STEP_SUMMARY
          FORMATTING_ISSUES=$((FORMATTING_ISSUES + 1))
        fi
        
        # Check for mixed line endings
        if find src/ -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" | xargs file | grep "CRLF" > /dev/null 2>&1; then
          echo "- WARNING: CRLF line endings found (should be LF)" >> $GITHUB_STEP_SUMMARY
          FORMATTING_ISSUES=$((FORMATTING_ISSUES + 1))
        fi
        
        # Check for tabs vs spaces consistency
        if find src/ -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" | xargs grep -P "\t" > /dev/null 2>&1; then
          echo "- INFO: Tab characters found (verify consistency with project style)" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ $FORMATTING_ISSUES -eq 0 ]; then
          echo "- Code formatting looks good" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Check for common code issues
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Code Quality Check" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for console.log statements
        CONSOLE_LOGS=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -n "console\." | grep -v "// eslint-disable" | wc -l)
        if [ $CONSOLE_LOGS -gt 0 ]; then
          echo "- WARNING: $CONSOLE_LOGS console.log statements found (consider removing for production)" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for TODO/FIXME comments
        TODO_COUNT=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -i "TODO\|FIXME" | wc -l)
        if [ $TODO_COUNT -gt 0 ]; then
          echo "- INFO: $TODO_COUNT TODO/FIXME comments found" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for hardcoded URLs or sensitive patterns
        HARDCODED_URLS=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -E "http://|https://|localhost" | grep -v "//.*http" | wc -l)
        if [ $HARDCODED_URLS -gt 0 ]; then
          echo "- WARNING: $HARDCODED_URLS potential hardcoded URLs found" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for long functions (over 50 lines)
        LONG_FUNCTIONS=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -n "function\|=>" | while read -r line; do
          file=$(echo "$line" | cut -d: -f1)
          line_num=$(echo "$line" | cut -d: -f2)
          # Simple heuristic: count lines until next function or end of file
          total_lines=$(wc -l < "$file")
          remaining_lines=$((total_lines - line_num))
          if [ $remaining_lines -gt 50 ]; then
            echo "$file:$line_num"
          fi
        done | wc -l)
        if [ $LONG_FUNCTIONS -gt 0 ]; then
          echo "- INFO: $LONG_FUNCTIONS potentially long functions found (consider refactoring)" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for React anti-patterns
        REACT_ISSUES=0
        
        # Check for inline styles
        INLINE_STYLES=$(find src/ -name "*.jsx" | xargs grep -n "style={{" | wc -l)
        if [ $INLINE_STYLES -gt 0 ]; then
          echo "- INFO: $INLINE_STYLES inline styles found (consider CSS-in-JS or external styles)" >> $GITHUB_STEP_SUMMARY
          REACT_ISSUES=$((REACT_ISSUES + 1))
        fi
        
        # Check for missing key props in lists
        MISSING_KEYS=$(find src/ -name "*.jsx" | xargs grep -n "\.map(" | xargs grep -L "key=" | wc -l)
        if [ $MISSING_KEYS -gt 0 ]; then
          echo "- WARNING: Potential missing key props in React lists" >> $GITHUB_STEP_SUMMARY
          REACT_ISSUES=$((REACT_ISSUES + 1))
        fi
        
        if [ $REACT_ISSUES -eq 0 ]; then
          echo "- React code patterns look good" >> $GITHUB_STEP_SUMMARY
        fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci --prefer-offline --no-audit
        else
          npm install --prefer-offline --no-audit
        fi
        
    - name: Advanced security vulnerability scan
      run: |
        echo "## Security Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Run npm audit with detailed output
        if npm audit --audit-level=moderate --json > audit-results.json 2>/dev/null; then
          echo "- No high or critical security vulnerabilities found" >> $GITHUB_STEP_SUMMARY
        else
          echo "- Security vulnerabilities detected:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate 2>/dev/null | head -30 >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # Count vulnerabilities by severity
          if [ -f audit-results.json ]; then
            CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' audit-results.json)
            HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' audit-results.json)
            MODERATE=$(jq -r '.metadata.vulnerabilities.moderate // 0' audit-results.json)
            LOW=$(jq -r '.metadata.vulnerabilities.low // 0' audit-results.json)
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Vulnerability Summary:" >> $GITHUB_STEP_SUMMARY
            echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- Moderate: $MODERATE" >> $GITHUB_STEP_SUMMARY
            echo "- Low: $LOW" >> $GITHUB_STEP_SUMMARY
          fi
        fi
      continue-on-error: true
      
    - name: Check for sensitive information
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Sensitive Information Check" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for potential secrets
        POTENTIAL_SECRETS=0
        
        # Check for API keys pattern
        if find . -name "*.js" -o -name "*.jsx" -o -name "*.json" | xargs grep -i "api[_-]key\|apikey" | grep -v node_modules > /dev/null 2>&1; then
          echo "- WARNING: Potential API key references found" >> $GITHUB_STEP_SUMMARY
          POTENTIAL_SECRETS=$((POTENTIAL_SECRETS + 1))
        fi
        
        # Check for password patterns
        if find . -name "*.js" -o -name "*.jsx" -o -name "*.json" | xargs grep -i "password.*=" | grep -v node_modules | grep -v "passwordField\|passwordInput\|passwordValidator" > /dev/null 2>&1; then
          echo "- WARNING: Potential hardcoded password found" >> $GITHUB_STEP_SUMMARY
          POTENTIAL_SECRETS=$((POTENTIAL_SECRETS + 1))
        fi
        
        # Check for token patterns
        if find . -name "*.js" -o -name "*.jsx" -o -name "*.json" | xargs grep -E "token.*[=:].*['\"][a-zA-Z0-9]{20,}" | grep -v node_modules > /dev/null 2>&1; then
          echo "- WARNING: Potential hardcoded token found" >> $GITHUB_STEP_SUMMARY
          POTENTIAL_SECRETS=$((POTENTIAL_SECRETS + 1))
        fi
        
        if [ $POTENTIAL_SECRETS -eq 0 ]; then
          echo "- No obvious sensitive information found in source code" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Check for security best practices
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Security Best Practices Check" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        SECURITY_ISSUES=0
        
        # Check for eval() usage
        EVAL_USAGE=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -n "eval(" | wc -l)
        if [ $EVAL_USAGE -gt 0 ]; then
          echo "- CRITICAL: $EVAL_USAGE eval() statements found (security risk)" >> $GITHUB_STEP_SUMMARY
          SECURITY_ISSUES=$((SECURITY_ISSUES + 1))
        fi
        
        # Check for innerHTML usage (XSS risk)
        INNERHTML_USAGE=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -n "innerHTML" | wc -l)
        if [ $INNERHTML_USAGE -gt 0 ]; then
          echo "- WARNING: $INNERHTML_USAGE innerHTML usages found (potential XSS risk)" >> $GITHUB_STEP_SUMMARY
          SECURITY_ISSUES=$((SECURITY_ISSUES + 1))
        fi
        
        # Check for document.write usage
        DOCUMENT_WRITE=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -n "document.write" | wc -l)
        if [ $DOCUMENT_WRITE -gt 0 ]; then
          echo "- WARNING: $DOCUMENT_WRITE document.write usages found (security risk)" >> $GITHUB_STEP_SUMMARY
          SECURITY_ISSUES=$((SECURITY_ISSUES + 1))
        fi
        
        # Check for dangerouslySetInnerHTML in React
        DANGEROUS_HTML=$(find src/ -name "*.jsx" | xargs grep -n "dangerouslySetInnerHTML" | wc -l)
        if [ $DANGEROUS_HTML -gt 0 ]; then
          echo "- WARNING: $DANGEROUS_HTML dangerouslySetInnerHTML usages found (ensure content is sanitized)" >> $GITHUB_STEP_SUMMARY
          SECURITY_ISSUES=$((SECURITY_ISSUES + 1))
        fi
        
        # Check for HTTP URLs (should use HTTPS)
        HTTP_URLS=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -n "http://" | grep -v localhost | wc -l)
        if [ $HTTP_URLS -gt 0 ]; then
          echo "- INFO: $HTTP_URLS HTTP URLs found (consider using HTTPS)" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ $SECURITY_ISSUES -eq 0 ]; then
          echo "- No obvious security issues found in code patterns" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Dependency security analysis
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Dependency Security Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for known vulnerable packages
        VULNERABLE_PACKAGES=0
        
        # List of packages with known security issues (examples)
        if grep -q "lodash.*[\"'][^4]" package.json; then
          echo "- WARNING: Old lodash version detected (consider updating)" >> $GITHUB_STEP_SUMMARY
          VULNERABLE_PACKAGES=$((VULNERABLE_PACKAGES + 1))
        fi
        
        if grep -q "moment" package.json; then
          echo "- INFO: Moment.js detected (consider modern alternatives like date-fns or dayjs)" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for dev dependencies in production
        if jq -e '.dependencies | has("eslint")' package.json > /dev/null 2>&1; then
          echo "- WARNING: ESLint found in production dependencies (should be devDependency)" >> $GITHUB_STEP_SUMMARY
        fi
        
        if jq -e '.dependencies | has("jest")' package.json > /dev/null 2>&1; then
          echo "- WARNING: Jest found in production dependencies (should be devDependency)" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check package-lock.json integrity
        if [ -f "package-lock.json" ]; then
          if ! npm ci --dry-run > /dev/null 2>&1; then
            echo "- ERROR: package-lock.json integrity check failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Package-lock.json integrity verified" >> $GITHUB_STEP_SUMMARY
          fi
        fi
      continue-on-error: true

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, security-audit]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci --prefer-offline --no-audit
        else
          npm install --prefer-offline --no-audit
        fi
        
    - name: Check dependency health
      run: |
        echo "## Dependency Health" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for outdated dependencies
        if npm outdated --json > outdated.json 2>/dev/null; then
          if [ -s outdated.json ]; then
            echo "### Outdated Dependencies:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Current | Wanted | Latest | Type |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|---------|---------|---------|------|" >> $GITHUB_STEP_SUMMARY
            
            # Parse outdated packages
            jq -r 'to_entries[] | "| \(.key) | \(.value.current) | \(.value.wanted) | \(.value.latest) | \(.value.type) |"' outdated.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          else
            echo "- All dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "- All dependencies are up to date" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for duplicate dependencies
        if [ -f "package-lock.json" ]; then
          DUPLICATES=$(npm ls --all 2>/dev/null | grep -E "├─|└─" | awk '{print $2}' | sort | uniq -d | wc -l)
          if [ $DUPLICATES -gt 0 ]; then
            echo "- WARNING: $DUPLICATES potential duplicate dependencies found" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No duplicate dependencies found" >> $GITHUB_STEP_SUMMARY
          fi
        fi
      continue-on-error: true
        
    - name: Build project with detailed analysis
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Clean any previous builds
        rm -rf build dist
        
        # Build with timing
        START_TIME=$(date +%s)
        if npm run build; then
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "- Build completed successfully in ${BUILD_TIME}s" >> $GITHUB_STEP_SUMMARY
        else
          echo "- Build failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        
    - name: Analyze build output
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Output Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "build" ]; then
          # Calculate sizes
          TOTAL_SIZE=$(du -sh build | cut -f1)
          JS_SIZE=$(find build -name "*.js" -exec du -ch {} + | grep total | cut -f1)
          CSS_SIZE=$(find build -name "*.css" -exec du -ch {} + | grep total | cut -f1)
          
          echo "| Component | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Build | $TOTAL_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript | ${JS_SIZE:-0B} |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS | ${CSS_SIZE:-0B} |" >> $GITHUB_STEP_SUMMARY
          
          # Count files
          JS_FILES=$(find build -name "*.js" | wc -l)
          CSS_FILES=$(find build -name "*.css" | wc -l)
          HTML_FILES=$(find build -name "*.html" | wc -l)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### File Count:" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript files: $JS_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- CSS files: $CSS_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- HTML files: $HTML_FILES" >> $GITHUB_STEP_SUMMARY
          
          # Check for large files
          LARGE_FILES=$(find build -size +1M -type f | wc -l)
          if [ $LARGE_FILES -gt 0 ]; then
            echo "- WARNING: $LARGE_FILES files larger than 1MB found" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "- Build directory not found" >> $GITHUB_STEP_SUMMARY
        fi

  package-analysis:
    name: Package Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Analyze package structure
      run: |
        echo "## Package Structure Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Package information
        NAME=$(jq -r '.name' package.json)
        VERSION=$(jq -r '.version' package.json)
        DESCRIPTION=$(jq -r '.description' package.json)
        LICENSE=$(jq -r '.license' package.json)
        
        echo "### Package Information:" >> $GITHUB_STEP_SUMMARY
        echo "- **Name**: $NAME" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **License**: $LICENSE" >> $GITHUB_STEP_SUMMARY
        echo "- **Description**: $DESCRIPTION" >> $GITHUB_STEP_SUMMARY
        
        # Count dependencies
        PROD_DEPS=$(jq -r '.dependencies | keys[]' package.json 2>/dev/null | wc -l)
        DEV_DEPS=$(jq -r '.devDependencies | keys[]' package.json 2>/dev/null | wc -l)
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Dependencies:" >> $GITHUB_STEP_SUMMARY
        echo "- Production: $PROD_DEPS" >> $GITHUB_STEP_SUMMARY
        echo "- Development: $DEV_DEPS" >> $GITHUB_STEP_SUMMARY
        echo "- Total: $((PROD_DEPS + DEV_DEPS))" >> $GITHUB_STEP_SUMMARY
        
        # Check package.json health
        HEALTH_SCORE=0
        
        # Check for required fields
        if jq -e '.main' package.json > /dev/null 2>&1; then HEALTH_SCORE=$((HEALTH_SCORE + 1)); fi
        if jq -e '.scripts.start' package.json > /dev/null 2>&1; then HEALTH_SCORE=$((HEALTH_SCORE + 1)); fi
        if jq -e '.scripts.build' package.json > /dev/null 2>&1; then HEALTH_SCORE=$((HEALTH_SCORE + 1)); fi
        if jq -e '.author' package.json > /dev/null 2>&1; then HEALTH_SCORE=$((HEALTH_SCORE + 1)); fi
        if jq -e '.repository' package.json > /dev/null 2>&1; then HEALTH_SCORE=$((HEALTH_SCORE + 1)); fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Package Health Score: $HEALTH_SCORE/5" >> $GITHUB_STEP_SUMMARY
        
    - name: Check code metrics
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Code Metrics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count lines of code
        if [ -d "src" ]; then
          TOTAL_FILES=$(find src -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" | wc -l)
          TOTAL_LINES=$(find src -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" | xargs wc -l | tail -1 | awk '{print $1}')
          
          echo "### Source Code:" >> $GITHUB_STEP_SUMMARY
          echo "- Files: $TOTAL_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- Lines of code: $TOTAL_LINES" >> $GITHUB_STEP_SUMMARY
          
          # Calculate average file size
          if [ $TOTAL_FILES -gt 0 ]; then
            AVG_LINES=$((TOTAL_LINES / TOTAL_FILES))
            echo "- Average lines per file: $AVG_LINES" >> $GITHUB_STEP_SUMMARY
            
            if [ $AVG_LINES -gt 300 ]; then
              echo "- INFO: Some files might be large. Consider splitting for better maintainability." >> $GITHUB_STEP_SUMMARY
            fi
          fi
        fi
        
        # Check for component structure
        if [ -d "src/components" ]; then
          COMPONENTS=$(find src/components -name "*.jsx" -o -name "*.tsx" | wc -l)
          echo "- React components: $COMPONENTS" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for utility files
        if [ -d "utils" ] || [ -d "src/utils" ]; then
          UTILS=$(find . -path "*/utils/*.js" -o -path "*/utils/*.jsx" | wc -l)
          echo "- Utility files: $UTILS" >> $GITHUB_STEP_SUMMARY
        fi

  performance-check:
    name: Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-test]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies and build
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci --prefer-offline --no-audit
        else
          npm install --prefer-offline --no-audit
        fi
        npm run build
        
    - name: Bundle size analysis
      run: |
        echo "## Performance Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "build" ]; then
          # Analyze bundle sizes
          echo "### Bundle Size Analysis:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Find largest files
          echo "**Largest files:**" >> $GITHUB_STEP_SUMMARY
          find build -type f -name "*.js" -o -name "*.css" | xargs ls -lah | sort -k5 -hr | head -10 | while read -r line; do
            size=$(echo $line | awk '{print $5}')
            file=$(echo $line | awk '{print $9}' | sed 's|build/||')
            echo "- $file: $size" >> $GITHUB_STEP_SUMMARY
          done
          
          # Calculate gzip sizes for main files
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Estimated gzip sizes:**" >> $GITHUB_STEP_SUMMARY
          find build -name "*.js" -o -name "*.css" | head -5 | while read -r file; do
            if command -v gzip > /dev/null 2>&1; then
              original_size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file")
              gzip_size=$(gzip -c "$file" | wc -c)
              filename=$(basename "$file")
              echo "- $filename: ${original_size} bytes → ${gzip_size} bytes (gzipped)" >> $GITHUB_STEP_SUMMARY
            fi
          done
        fi
        
    - name: Project size warning
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Project Size Summary:" >> $GITHUB_STEP_SUMMARY
        
        # Calculate total sizes
        TOTAL_SIZE=$(du -sh . | cut -f1)
        NODE_MODULES_SIZE=$(du -sh node_modules 2>/dev/null | cut -f1 || echo "0B")
        SRC_SIZE=$(du -sh src 2>/dev/null | cut -f1 || echo "0B")
        BUILD_SIZE=$(du -sh build 2>/dev/null | cut -f1 || echo "0B")
        
        echo "- Total project: $TOTAL_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- Dependencies: $NODE_MODULES_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- Source code: $SRC_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- Build output: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY
        
        # Size warnings
        TOTAL_SIZE_MB=$(du -sm . | cut -f1)
        if [ "$TOTAL_SIZE_MB" -gt 1000 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**WARNING**: Project size is very large (${TOTAL_SIZE}). Consider:" >> $GITHUB_STEP_SUMMARY
          echo "- Removing unused dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Using .dockerignore and .gitignore properly" >> $GITHUB_STEP_SUMMARY
          echo "- Optimizing asset sizes" >> $GITHUB_STEP_SUMMARY
        elif [ "$TOTAL_SIZE_MB" -gt 500 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**NOTICE**: Project size is moderate (${TOTAL_SIZE}). Monitor for growth." >> $GITHUB_STEP_SUMMARY
        fi
        
  documentation-check:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check documentation completeness
      run: |
        echo "## Documentation Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        DOC_SCORE=0
        
        # Check for README
        if [ -f "README.md" ]; then
          DOC_SCORE=$((DOC_SCORE + 1))
          README_SIZE=$(wc -l < README.md)
          echo "- README.md found ($README_SIZE lines)" >> $GITHUB_STEP_SUMMARY
          
          # Check README content quality
          if grep -q "## Installation\|## Setup\|## Getting Started" README.md; then
            echo "- Installation instructions found" >> $GITHUB_STEP_SUMMARY
            DOC_SCORE=$((DOC_SCORE + 1))
          fi
          
          if grep -q "## Usage\|## Examples" README.md; then
            echo "- Usage examples found" >> $GITHUB_STEP_SUMMARY
            DOC_SCORE=$((DOC_SCORE + 1))
          fi
        else
          echo "- WARNING: README.md not found" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for other documentation files
        if [ -f "CONTRIBUTING.md" ]; then
          echo "- CONTRIBUTING.md found" >> $GITHUB_STEP_SUMMARY
          DOC_SCORE=$((DOC_SCORE + 1))
        fi
        
        if [ -f "CHANGELOG.md" ]; then
          echo "- CHANGELOG.md found" >> $GITHUB_STEP_SUMMARY
          DOC_SCORE=$((DOC_SCORE + 1))
        fi
        
        if [ -f "LICENSE" ] || [ -f "LICENSE.md" ]; then
          echo "- License file found" >> $GITHUB_STEP_SUMMARY
          DOC_SCORE=$((DOC_SCORE + 1))
        fi
        
        # Check for JSDoc comments
        if [ -d "src" ]; then
          JSDOC_COMMENTS=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -c "/\*\*" | awk -F: '{sum+=$2} END {print sum+0}')
          if [ $JSDOC_COMMENTS -gt 0 ]; then
            echo "- Found $JSDOC_COMMENTS JSDoc comments" >> $GITHUB_STEP_SUMMARY
            DOC_SCORE=$((DOC_SCORE + 1))
          fi
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Documentation Score: $DOC_SCORE/7" >> $GITHUB_STEP_SUMMARY
        
        if [ $DOC_SCORE -lt 4 ]; then
          echo "- RECOMMENDATION: Consider improving documentation coverage" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Check code comments quality
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Code Comments Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "src" ]; then
          TOTAL_LINES=$(find src/ -name "*.js" -o -name "*.jsx" | xargs wc -l | tail -1 | awk '{print $1}')
          COMMENT_LINES=$(find src/ -name "*.js" -o -name "*.jsx" | xargs grep -c "^\s*//\|^\s*/\*" | awk -F: '{sum+=$2} END {print sum+0}')
          
          if [ $TOTAL_LINES -gt 0 ]; then
            COMMENT_RATIO=$((COMMENT_LINES * 100 / TOTAL_LINES))
            echo "- Comment ratio: $COMMENT_RATIO% ($COMMENT_LINES/$TOTAL_LINES lines)" >> $GITHUB_STEP_SUMMARY
            
            if [ $COMMENT_RATIO -lt 10 ]; then
              echo "- INFO: Low comment ratio. Consider adding more explanatory comments." >> $GITHUB_STEP_SUMMARY
            elif [ $COMMENT_RATIO -gt 30 ]; then
              echo "- INFO: High comment ratio. Ensure comments add value." >> $GITHUB_STEP_SUMMARY
            else
              echo "- Comment ratio looks reasonable" >> $GITHUB_STEP_SUMMARY
            fi
          fi
        fi

  accessibility-check:
    name: Accessibility Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Check accessibility patterns
      run: |
        echo "## Accessibility Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        A11Y_ISSUES=0
        
        if [ -d "src" ]; then
          # Check for missing alt attributes
          MISSING_ALT=$(find src/ -name "*.jsx" | xargs grep -n "<img" | grep -v "alt=" | wc -l)
          if [ $MISSING_ALT -gt 0 ]; then
            echo "- WARNING: $MISSING_ALT img tags without alt attributes found" >> $GITHUB_STEP_SUMMARY
            A11Y_ISSUES=$((A11Y_ISSUES + 1))
          fi
          
          # Check for missing labels on inputs
          UNLABELED_INPUTS=$(find src/ -name "*.jsx" | xargs grep -n "<input" | grep -v "aria-label\|aria-labelledby" | grep -v "type=\"hidden\"" | wc -l)
          if [ $UNLABELED_INPUTS -gt 0 ]; then
            echo "- WARNING: $UNLABELED_INPUTS input elements without proper labels found" >> $GITHUB_STEP_SUMMARY
            A11Y_ISSUES=$((A11Y_ISSUES + 1))
          fi
          
          # Check for button accessibility
          BUTTON_ISSUES=$(find src/ -name "*.jsx" | xargs grep -n "<button" | grep -v "aria-label\|children" | wc -l)
          if [ $BUTTON_ISSUES -gt 0 ]; then
            echo "- INFO: Review $BUTTON_ISSUES buttons for proper labeling" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for heading structure
          H1_COUNT=$(find src/ -name "*.jsx" | xargs grep -o "<h1" | wc -l)
          if [ $H1_COUNT -eq 0 ]; then
            echo "- INFO: No h1 elements found. Consider adding page headings." >> $GITHUB_STEP_SUMMARY
          elif [ $H1_COUNT -gt 3 ]; then
            echo "- INFO: Multiple h1 elements found. Consider using h2-h6 for hierarchy." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for color-only indicators
          COLOR_ONLY=$(find src/ -name "*.jsx" | xargs grep -n "color.*red\|color.*green" | wc -l)
          if [ $COLOR_ONLY -gt 0 ]; then
            echo "- INFO: $COLOR_ONLY potential color-only indicators found. Ensure additional context is provided." >> $GITHUB_STEP_SUMMARY
          fi
        fi
        
        if [ $A11Y_ISSUES -eq 0 ]; then
          echo "- No obvious accessibility issues found" >> $GITHUB_STEP_SUMMARY
        else
          echo "- Total accessibility issues: $A11Y_ISSUES" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Accessibility Recommendations:" >> $GITHUB_STEP_SUMMARY
        echo "- Use semantic HTML elements" >> $GITHUB_STEP_SUMMARY
        echo "- Provide alt text for images" >> $GITHUB_STEP_SUMMARY
        echo "- Ensure proper label associations" >> $GITHUB_STEP_SUMMARY
        echo "- Test with screen readers" >> $GITHUB_STEP_SUMMARY
        echo "- Maintain proper heading hierarchy" >> $GITHUB_STEP_SUMMARY

  final-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, security-audit, build-test, package-analysis, performance-check, documentation-check, accessibility-check]
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Generate quality report
      run: |
        echo "# Code Quality Summary Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Generated on: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Calculate overall score based on job results
        TOTAL_JOBS=7
        PASSED_JOBS=0
        
        # Note: In a real scenario, you'd check job results
        # For now, we'll provide a template
        
        echo "## Job Results Summary:" >> $GITHUB_STEP_SUMMARY
        echo "- Lint and Format Check: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY  
        echo "- Build and Test: ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Package Analysis: ${{ needs.package-analysis.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Performance Check: ${{ needs.performance-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Documentation Check: ${{ needs.documentation-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Accessibility Check: ${{ needs.accessibility-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "## Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Review any warnings or errors above" >> $GITHUB_STEP_SUMMARY
        echo "2. Update dependencies if vulnerabilities found" >> $GITHUB_STEP_SUMMARY
        echo "3. Address code quality issues" >> $GITHUB_STEP_SUMMARY
        echo "4. Improve documentation if score is low" >> $GITHUB_STEP_SUMMARY
        echo "5. Test accessibility with real users" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "For detailed results, check individual job outputs above." >> $GITHUB_STEP_SUMMARY
