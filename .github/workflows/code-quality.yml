name: Code Quality and Security Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --prefer-offline --no-audit
        
    - name: Security vulnerability scan
      run: |
        echo "##  Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for known vulnerabilities
        if npm audit --audit-level=moderate --json > audit-results.json 2>/dev/null; then
          echo " No security vulnerabilities found" >> $GITHUB_STEP_SUMMARY
        else
          echo " Security vulnerabilities detected:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true
      
    - name: Check for outdated dependencies
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "##  Dependency Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if npm outdated --json > outdated.json 2>/dev/null; then
          if [ -s outdated.json ]; then
            echo " Outdated packages found:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Current | Wanted | Latest |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|---------|---------|---------|" >> $GITHUB_STEP_SUMMARY
            
            # Parse outdated packages and add to summary
            npm outdated 2>/dev/null | tail -n +2 | head -10 | while read line; do
              echo "| $line |" >> $GITHUB_STEP_SUMMARY || true
            done
          else
            echo " All dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo " All dependencies are up to date" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true
      
    - name: Build project
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🔨 Build Process" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if npm run build; then
          echo " Build completed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo " Build failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        
    - name: Analyze build artifacts
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "##  Build Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "build" ]; then
          echo "### Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Type |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          
          find build -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" \) | while read file; do
            size=$(du -h "$file" | cut -f1)
            type=$(file -b --mime-type "$file" 2>/dev/null || echo "unknown")
            echo "| $(basename "$file") | $size | $type |" >> $GITHUB_STEP_SUMMARY
          done
          
          # Total build size
          total_size=$(du -sh build 2>/dev/null | cut -f1)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total build size: $total_size**" >> $GITHUB_STEP_SUMMARY
        else
          echo " Build directory not found" >> $GITHUB_STEP_SUMMARY
        fi

  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Analyze package structure
      run: |
        echo "##  Package Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count dependencies
        PROD_DEPS=$(jq -r '.dependencies | keys[]' package.json 2>/dev/null | wc -l)
        DEV_DEPS=$(jq -r '.devDependencies | keys[]' package.json 2>/dev/null | wc -l)
        
        echo "### Dependency Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Production dependencies**: $PROD_DEPS" >> $GITHUB_STEP_SUMMARY
        echo "- **Development dependencies**: $DEV_DEPS" >> $GITHUB_STEP_SUMMARY
        echo "- **Total dependencies**: $((PROD_DEPS + DEV_DEPS))" >> $GITHUB_STEP_SUMMARY
        
        # Package information
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Package Information" >> $GITHUB_STEP_SUMMARY
        NAME=$(jq -r '.name' package.json)
        VERSION=$(jq -r '.version' package.json)
        DESCRIPTION=$(jq -r '.description' package.json)
        
        echo "- **Name**: $NAME" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **Description**: $DESCRIPTION" >> $GITHUB_STEP_SUMMARY
        
    - name: Check for dependency conflicts
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Dependency Health Check" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Install dependencies to check for conflicts
        if npm ci --prefer-offline 2>&1 | grep -i "warn\|error"; then
          echo " Dependency warnings or errors detected" >> $GITHUB_STEP_SUMMARY
        else
          echo " No dependency conflicts found" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: License compliance check
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### License Information" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check main package license
        LICENSE=$(jq -r '.license' package.json 2>/dev/null || echo "Not specified")
        echo "- **Project License**: $LICENSE" >> $GITHUB_STEP_SUMMARY
        
        # Check for common license types in dependencies
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Note**: For production use, ensure all dependency licenses are compatible with your project's license." >> $GITHUB_STEP_SUMMARY

  package-size-analysis:
    name: Package Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --prefer-offline
      
    - name: Analyze package size
      run: |
        echo "##  Package Size Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Calculate sizes
        TOTAL_SIZE=$(du -sh . | cut -f1)
        NODE_MODULES_SIZE=$(du -sh node_modules 2>/dev/null | cut -f1 || echo "0B")
        SRC_SIZE=$(du -sh src 2>/dev/null | cut -f1 || echo "0B")
        ASSETS_SIZE=$(du -sh assets 2>/dev/null | cut -f1 || echo "0B")
        
        echo "### Size Breakdown" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Size |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| Total Project | $TOTAL_SIZE |" >> $GITHUB_STEP_SUMMARY
        echo "| Node Modules | $NODE_MODULES_SIZE |" >> $GITHUB_STEP_SUMMARY
        echo "| Source Code | $SRC_SIZE |" >> $GITHUB_STEP_SUMMARY
        echo "| Assets | $ASSETS_SIZE |" >> $GITHUB_STEP_SUMMARY
        
        # Check if size is reasonable
        TOTAL_SIZE_MB=$(du -sm . | cut -f1)
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$TOTAL_SIZE_MB" -gt 1000 ]; then
          echo " **Warning**: Package size is quite large ($TOTAL_SIZE). Consider optimizing dependencies." >> $GITHUB_STEP_SUMMARY
        elif [ "$TOTAL_SIZE_MB" -gt 500 ]; then
          echo "⚡ **Notice**: Package size is moderate ($TOTAL_SIZE). Monitor for further growth." >> $GITHUB_STEP_SUMMARY
        else
          echo " **Good**: Package size is reasonable ($TOTAL_SIZE)." >> $GITHUB_STEP_SUMMARY
        fi
