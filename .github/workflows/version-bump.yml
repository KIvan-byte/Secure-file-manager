name: Version Bump and Tag

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major
        - prerelease
      prerelease_type:
        description: 'Prerelease type (only for prerelease)'
        required: false
        default: 'beta'
        type: choice
        options:
        - alpha
        - beta
        - rc

jobs:
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
        
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
    - name: Install dependencies
      run: if [ -f "package-lock.json" ]; then npm ci --prefer-offline; else npm install --prefer-offline; fi
      
    - name: Bump version
      id: version
      run: |
        echo "Current version: $(npm pkg get version)"
        
        if [ "${{ inputs.version_type }}" = "prerelease" ]; then
          NEW_VERSION=$(npm version prerelease --preid=${{ inputs.prerelease_type }} --no-git-tag-version)
        else
          NEW_VERSION=$(npm version ${{ inputs.version_type }} --no-git-tag-version)
        fi
        
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${NEW_VERSION#v}" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"
        
    - name: Update version in application files
      run: |
        # Update version in main.js if version variable exists
        if grep -q "const.*version.*=" main.js; then
          sed -i "s/const version = .*/const version = '${{ steps.version.outputs.version_number }}';/" main.js
        elif grep -q "version.*=" main.js; then
          sed -i "s/version.*=.*/version = '${{ steps.version.outputs.version_number }}';/" main.js
        fi
        
        # Update version in preload.js if exists
        if [ -f "preload.js" ] && grep -q "version" preload.js; then
          sed -i "s/version: .*/version: '${{ steps.version.outputs.version_number }}',/" preload.js
        fi
        
    - name: Generate changelog
      id: changelog
      run: |
        {
          echo "CHANGELOG<<EOF"
          echo "## Release ${{ steps.version.outputs.new_version }}"
          echo ""
          echo "### What's Changed"
          echo ""
          echo "This release includes the latest updates and improvements to Secure File Manager."
          echo ""
          echo "###  Security Features"
          echo "- Military-grade AES-256-GCM encryption"
          echo "- Two-factor authentication support"
          echo "- Secure file sharing with expiration"
          echo "- Comprehensive access logging"
          echo ""
          echo "###  Platform Support"
          echo "- Linux (AppImage, DEB, RPM)"
          echo "- Windows (NSIS Installer, Portable)"
          echo "- macOS (DMG) - Available on tagged releases"
          echo ""
          echo "###  Installation"
          echo "1. Download the appropriate package for your platform"
          echo "2. Follow the installation instructions for your OS"
          echo "3. Launch the application and configure your preferences"
          echo ""
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.new_version }}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        
    - name: Commit version bump
      run: |
        git add package.json package-lock.json main.js preload.js 2>/dev/null || true
        git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}" || exit 0
        
    - name: Create and push tag
      run: |
        git tag ${{ steps.version.outputs.new_version }}
        git push origin main --follow-tags
        git push origin ${{ steps.version.outputs.new_version }}
        
    - name: Create GitHub Release Draft
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.new_version }}
        name: Release ${{ steps.version.outputs.new_version }}
        draft: true
        prerelease: ${{ contains(steps.version.outputs.new_version, 'alpha') || contains(steps.version.outputs.new_version, 'beta') || contains(steps.version.outputs.new_version, 'rc') }}
        body: ${{ steps.changelog.outputs.CHANGELOG }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
