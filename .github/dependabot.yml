# Security Configuration for GitHub Actions

# Dependabot configuration for automated dependency updates
version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "@KIvan-byte"
    assignees:
      - "@KIvan-byte"
    commit-message:
      prefix: "deps"
      include: "scope"
    
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    reviewers:
      - "@KIvan-byte"
    assignees:
      - "@KIvan-byte"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "@KIvan-byte"
    assignees:
      - "@KIvan-byte"
    commit-message:
      prefix: "docker"
      include: "scope"
